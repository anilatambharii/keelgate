[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keelgate-cloud"
version = "0.0.0"
description = "Keelgate Cloud control plane (proprietary; see ee/LICENSE)"
requires-python = ">=3.11"
license = { text = "LicenseRef-Keelgate-EE" }
dependencies = [
    "keelgate",
    "fastapi>=0.142,<1",
    "uvicorn>=0.30",
    "pydantic>=2.11,<3",
    "psycopg[binary,pool]>=3.3,<4",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.9,<3",
    "pyyaml>=6,<7",
    "stripe>=12,<20",
    "argon2-cffi>=23",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "httpx2>=1",
]

[tool.uv.sources]
keelgate = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/keelgate_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error::DeprecationWarning:keelgate_cloud.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "ARG", "SIM", "RUF", "PL", "TCH"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "S608", "TC003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI resolves parameter annotations at runtime, so they must stay real imports.
"src/keelgate_cloud/api/*.py" = ["TC001", "TC002", "TC003", "PLR0917"]
"tests/**" = ["TC001", "S101", "S105", "S106", "ARG001", "ARG002", "PLR0915", "S311"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
