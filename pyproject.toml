[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "keelgate"
version = "0.1.0"
description = "Safety-first agent harness for AI agents that touch money and regulated actions. The LLM proposes; deterministic code decides."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Keelgate Authors" }]
keywords = [
    "agents", "llm", "safety", "guardrails", "policy-as-code", "audit",
    "human-in-the-loop", "opentelemetry", "fintech", "governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "pyseto>=1.10,<2",      # PASETO v4.public capability grants
    "regopy>=1.5,<2",       # in-process Rego evaluation (tests, quickstart, local)
]

[project.scripts]
keelgate-approvals = "keelgate.approvals.cli:main"

# Fixtures for downstream projects' tests; loaded by pytest automatically.
[project.entry-points.pytest11]
keelgate = "keelgate.testing.plugin"

[project.urls]
Homepage = "https://github.com/anilatambharii/keelgate"
Repository = "https://github.com/anilatambharii/keelgate"
Issues = "https://github.com/anilatambharii/keelgate/issues"
Documentation = "https://github.com/anilatambharii/keelgate/tree/main/docs"

# Optional integrations. Keelgate wraps these frameworks; it never requires them.
# Install only what you adapt to, e.g. `pip install "keelgate[langgraph]"`.
[project.optional-dependencies]
langgraph = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-checkpoint-postgres>=3.1,<4",
]
openai = [
    "openai>=3.24,<4",
    "openai-agents>=0.23,<1",
]
anthropic = [
    "anthropic>=1.11,<2",
    "claude-agent-sdk>=0.2,<1",
]
temporal = [
    "temporalio>=1.34,<2",
]
google = [
    "google-genai>=2.28,<3",
]
mcp = [
    "mcp>=2.3,<3",
]
a2a = [
    "a2a-sdk>=1.2,<2",
]
cedar = [
    "cedarpy>=4.12,<5",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",   # OTLP/HTTP trace export (Jaeger, Phoenix)
]
server = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "redis>=8.1,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.168",
    "mypy>=2.4",
    "ruff>=0.16",
    "pre-commit>=4.6",
    "detect-secrets>=1.5",
    "fastapi>=0.142",            # REST approvals tests
    "cedarpy>=4.12",             # exercises the optional Cedar backend in tests
    # Every optional integration, so its adapter is exercised in tests rather than assumed.
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "openai>=3.24",
    "openai-agents>=0.23",
    "anthropic>=1.11",
    "claude-agent-sdk>=0.2",
    "google-genai>=2.28",
    "mcp>=2.3",
    "a2a-sdk>=1.2",
    "temporalio>=1.34",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "httpx2>=1",                 # what starlette's TestClient now expects
    "psycopg[binary]>=3.3",      # Postgres audit backend tests
]
docs = [
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keelgate"]

# Ship the default policy pack inside the wheel so `RegoEngine()` works after
# `pip install keelgate`. Tests (*_test.rego) stay out of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"policies/finance_basic/finance_basic.rego" = "keelgate/policy/packs/finance_basic/finance_basic.rego"
"policies/cedar_minimal/cedar_minimal.cedar" = "keelgate/policy/packs/cedar_minimal/cedar_minimal.cedar"

[tool.hatch.build.targets.sdist]
include = ["src/keelgate", "tests", "policies", "README.md", "LICENSE"]

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["ee/dashboard", "deploy"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # bugbear
    "A",          # builtins shadowing
    "C4",         # comprehensions
    "DTZ",        # timezone-aware datetimes — as_of correctness depends on this
    "T20",        # no print() in library code
    "SIM",        # simplify
    "TC",         # type-checking imports
    "PTH",        # pathlib
    "RUF",
    "S",          # bandit — security lint
    "ASYNC",
    "LOG", "G",   # logging correctness
    "PL",         # pylint subset
    "TRY",        # exception antipatterns
    "ARG",        # unused arguments
    "PGH",        # no blanket type: ignore
    "ERA",        # commented-out code
]
ignore = [
    "ISC001",     # conflicts with the formatter
    "TRY003",     # long messages outside exception class — we want readable errors
    "PLR0913",    # many arguments; policy/tool signatures are wide by nature
    "TRY300",     # style: a return inside try is fine when the try body is the work
    "TRY301",     # style: raising inside try to reuse one except clause is deliberate
]

[tool.ruff.lint.per-file-ignores]
# The _check_write / _embedding_for / _record_id_for hooks share one signature across all four
# tiers; each tier uses only the arguments it needs.
"src/keelgate/memory/tiers.py" = ["ARG002"]
# Tests and the demo are not shipped, and deliberately do things library code must not:
# assert, poke privates, hold dummy secrets, import locally to mutate the gateway.
"tests/**" = [
    "S101", "S105", "S106", "PLR2004", "PLR0915", "PLR0917", "ARG", "ERA001", "SLF001",
    "PLC0415", "TC001", "TC002", "TC003", "RUF043", "SIM117", "E501",
]
"examples/**" = ["T20", "PLR0915"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field annotations at runtime, so they must stay real imports.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# -------------------------------------------------------------------- mypy
# AGENTS.md: `mypy --strict` on src/.
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Optional integrations are not installed in the default dev env.
module = [
    "langgraph.*", "langgraph_checkpoint.*", "openai.*", "agents.*",
    "anthropic.*", "claude_agent_sdk.*", "temporalio.*", "cedarpy.*",
    "mcp.*", "a2a.*", "regopy.*", "pyseto.*", "psycopg.*", "jsonschema.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # The keelgate pytest plugin is loaded from tests/conftest.py instead of its entry point:
    # entry-point plugins import keelgate before coverage starts, which hides its top-level lines.
    "-p", "no:keelgate",
    # Live tests hit real services and cost money: run them on purpose with `-m live`.
    "-m", "not live",
    "--cov=keelgate",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
markers = [
    "live: calls real services; needs KEELGATE_LIVE=1 and credentials (run with -m live)",
    "slow: long-running tests, deselect with -m 'not slow'",
    "integration: needs `make up` services (Postgres/Redis/OPA)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/keelgate"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    "@overload",
    "if __name__ == .__main__.:",
]
