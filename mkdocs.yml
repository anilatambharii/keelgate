site_name: Keelgate
site_description: >-
  Safety-first agent harness for AI agents that touch money and regulated
  actions. The LLM proposes; deterministic code decides.
site_author: The Keelgate Authors
site_url: https://anilatambharii.github.io/keelgate/

repo_url: https://github.com/anilatambharii/keelgate
repo_name: anilatambharii/keelgate
edit_uri: edit/main/docs/
copyright: Copyright 2026 The Keelgate Authors — Apache-2.0

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: alphabetical
            heading_level: 2
            show_symbol_type_heading: true
            show_if_no_docstring: false
            inherited_members: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Tutorial: tutorial.md
  - Guides:
      - Governed LangGraph agent: guides/langgraph.md
      - MCP server for Claude Desktop and Cursor: guides/mcp-clients.md
      - Write your own policy pack: guides/custom-policy-pack.md
      - Telemetry, replay and evals: telemetry-and-evals.md
  - Security model: security-model.md
  - Reference:
      - API reference:
          - Overview: reference/index.md
          - "keelgate.tools": reference/tools.md
          - "keelgate.capabilities": reference/capabilities.md
          - "keelgate.policy": reference/policy.md
          - "keelgate.audit": reference/audit.md
          - "keelgate.approvals": reference/approvals.md
          - "keelgate.loop": reference/loop.md
          - "keelgate.context": reference/context.md
          - "keelgate.memory": reference/memory.md
          - "keelgate.llm": reference/llm.md
          - "keelgate.telemetry": reference/telemetry.md
          - "keelgate.evals": reference/evals.md
          - "keelgate.testing": reference/testing.md
          - "keelgate.adapters": reference/adapters.md
          - "keelgate.llm.providers": reference/llm-providers.md
          - "keelgate.adapters.mcp": reference/adapters-mcp.md
          - "keelgate.adapters.langgraph": reference/adapters-langgraph.md
          - "keelgate.adapters.openai_agents": reference/adapters-openai_agents.md
          - "keelgate.adapters.claude_agent_sdk": reference/adapters-claude_agent_sdk.md
          - "keelgate.adapters.a2a": reference/adapters-a2a.md
          - "keelgate.adapters.temporal": reference/adapters-temporal.md
          - Public modules: reference/modules.md
      - API contract: api-contract.md
      - Integration contract: integration-contract.md
  - Project:
      - Versioning and deprecation: versioning.md
      - Migrating to 0.2: migrating-to-0.2.md
      - Releasing: releasing.md
      - Changelog: changelog.md
  - Decisions:
      - "ADR-0001 Licensing and open core": adr/0001-licensing-and-open-core.md
      - "ADR-0002 Policy engine": adr/0002-policy-engine.md
      - "ADR-0003 Capability grants": adr/0003-capability-grants-paseto.md
      - "ADR-0004 Durable loop and resume": adr/0004-durable-loop-and-resume-semantics.md
      - "ADR-0005 Telemetry, replay and evals": adr/0005-telemetry-replay-and-evals.md

watch:
  - docs
  - src
  - examples
