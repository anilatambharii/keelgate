name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync the dev environment
        run: uv sync --frozen

      # The gate's stages run separately so a failure names itself in the UI,
      # while `make check` stays the single local entrypoint.
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff format)
        run: uv run ruff format --check --diff .

      - name: Types (mypy --strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Verify the installed package imports
        run: uv run python -c "import keelgate; print(keelgate.__version__)"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  extras:
    # The extras are the integration contract's install surface. Resolve and
    # install them here so a bad pin is caught by us, not by a downstream
    # project such as Tycheon.
    name: resolve all extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: The committed lockfile must be current
        run: uv lock --check

      - name: Install with every extra and group
        run: uv sync --all-extras --all-groups

      - name: Import the package with every adapter dependency present
        run: uv run python -c "import keelgate; print('ok', keelgate.__version__)"

  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: The wheel must ship py.typed
        run: |
          wheel="$(ls dist/*.whl)"
          if python3 -m zipfile -l "$wheel" | grep -q 'keelgate/py.typed'; then
            echo "py.typed present in $wheel"
          else
            echo "py.typed missing from $wheel — downstream mypy would see Any"
            exit 1
          fi

      - name: The wheel ships the policy pack but not its tests
        run: |
          wheel="$(ls dist/*.whl)"
          listing="$(python3 -m zipfile -l "$wheel")"
          echo "$listing" | grep -q 'keelgate/policy/packs/finance_basic/finance_basic.rego'             || { echo "finance_basic.rego missing from the wheel"; exit 1; }
          if echo "$listing" | grep -q '_test.rego'; then
            echo "Rego tests must not ship in the wheel"; exit 1
          fi

      - name: The wheel works on its own, with no repository checkout
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python - <<'PY'
          import asyncio
          from datetime import UTC, datetime
          from keelgate.policy import (
              PolicyAction, PolicyActor, PolicyContext, PolicyInput, RegoEngine, pack_path,
          )

          assert "site-packages" in str(pack_path("finance_basic")), "pack not read from the wheel"
          limits = {
              "max_notional_per_action": 50000, "max_daily_exposure": 100000,
              "restricted_symbols": ["TSLA"], "approval_one_click_notional": 10000,
              "approval_explicit_notional": 25000,
              "trading_hours": {"tz": "America/New_York", "open_minute": 570, "close_minute": 960},
          }
          decision = asyncio.run(RegoEngine().decide(PolicyInput(
              action=PolicyAction(tool="t", side_effect="WRITE", capability="trade:paper_execute"),
              actor=PolicyActor(agent_id="a", tenant_id="t", grant_id="g"),
              resource={"symbol": "AAPL", "notional": 100},
              context=PolicyContext(
                  as_of=datetime(2026, 10, 5, 14, 30, tzinfo=UTC),
                  limits=limits, exposure={"daily_notional": 0},
              ),
          )))
          assert decision.effect.value == "ALLOW", decision
          print("wheel ok:", decision.effect.value)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the docs with warnings as errors
        run: uv run --group docs mkdocs build --strict

  policy:
    # Real OPA over the Rego packs. The Python suite also evaluates them, but only a
    # real `opa test` proves the pack is valid Rego in the implementation production uses.
    name: policy packs (opa check, fmt, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.9.0

      - name: Check (strict)
        run: opa check --strict policies examples/custom_policy_pack

      - name: Formatting
        run: opa fmt --fail policies examples/custom_policy_pack

      - name: Unit tests
        run: opa test policies examples/custom_policy_pack -v

  evals:
    # Scripted-model evals on every PR: unit, trajectory, red-team and outcome suites, compared
    # against the committed baseline. Any red-team case that is not blocked, and any case or
    # metric that got worse than evals/baseline.json, fails the build.
    name: evals (scripted model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: Run evals and red-team suites
        run: uv run keelgate eval run --out eval-report --format json,html,md --baseline evals/baseline.json

      - name: Job summary
        if: always()
        run: cat eval-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn
          retention-days: 14

  integration:
    # The tests that need real services. KEELGATE_REQUIRE_INTEGRATION turns a missing
    # service into a failure: a suite that quietly skips these proves nothing.
    name: integration (Postgres + OPA + Temporal + Jaeger)
    runs-on: ubuntu-latest
    env:
      KEELGATE_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: Start Postgres and OPA from the dev stack
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres opa jaeger

      - name: Conformance (both Rego engines), Postgres audit and memory, quickstart, Temporal
        run: >-
          uv run pytest tests/test_policy_conformance.py tests/test_audit.py
          tests/test_quickstart.py tests/test_memory.py tests/test_adapter_temporal.py
          tests/test_jaeger_integration.py --no-cov -rs -p no:cacheprovider

      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
