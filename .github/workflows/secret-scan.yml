name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A key committed and then force-pushed away still needs finding.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repositories and for individual
          # accounts. An organisation-owned private repo needs GITLEAKS_LICENSE.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  detect-secrets:
    # Second opinion with a different detector, and it keeps the committed
    # baseline honest: a drifted baseline fails here rather than locally.
    name: detect-secrets baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: Audit against the committed baseline
        run: |
          uv run detect-secrets-hook \
            --baseline .secrets.baseline \
            $(git ls-files -- . ':!:uv.lock' ':!:.secrets.baseline')
