# Publish to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
#
# One-time setup (see docs/releasing.md): on pypi.org add a trusted publisher for this
# repository, workflow `publish.yml`, environment `pypi`; then create the GitHub environment
# `pypi` and give it required reviewers so a human approves each real upload.
#
#   * a tag `v*` builds, verifies the tag matches pyproject, smoke-tests the wheel, and then
#     publishes to PyPI once the `pypi` environment is approved;
#   * manual dispatch publishes to TestPyPI only: an optional dry run that needs a TestPyPI
#     trusted publisher and a `testpypi` environment. Skipping TestPyPI is fine; the PyPI job
#     does not depend on it.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

      - run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import keelgate; print(keelgate.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI (manual dry run)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
