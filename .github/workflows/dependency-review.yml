name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # AGENTS.md requires asking before adding a copyleft dependency.
          # These are denied outright so the conversation happens in review
          # rather than after release. Apache-2.0 cannot absorb them, and the
          # regulated adopters Keelgate targets will not accept them.
          deny-licenses: >-
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later,
            SSPL-1.0,
            BUSL-1.1
